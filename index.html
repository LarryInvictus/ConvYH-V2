<!DOCTYPE html>
<html>
<head>
<title>ConvYH V2 Proxy Browser</title>
<style>
body {
    background: #0f0f0f;
    color: white;
    font-family: Arial;
    margin: 0;
}
#topbar {
    background: #1a1a1a;
    padding: 10px;
    display: flex;
    gap: 10px;
}
#url {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: #222;
    color: white;
}
button {
    padding: 10px 20px;
    background: #3a3aff;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}
#view {
    padding: 20px;
    background: #111;
    height: calc(100vh - 70px);
    overflow-y: auto;
    border-top: 2px solid #333;
}
</style>
</head>
<body>

<div id="topbar">
    <input id="url" placeholder="Enter URL (https://example.com)">
    <button onclick="go()">Go</button>
</div>

<div id="view">ConvYH V2 Proxy Browser Ready.</div>

<script>
async function go() {
    const input = document.getElementById("url").value;

    const res = await fetch("http://localhost:3000/proxy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: input })
    });

    const data = await res.json();

    if (data.error) {
        document.getElementById("view").innerHTML =
            "<b>Error:</b> " + data.error;
        return;
    }

    document.getElementById("view").innerHTML = data.content;
}
</script>

</body>
</html>
