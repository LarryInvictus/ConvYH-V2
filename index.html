<!DOCTYPE html>
<html>
<head>
<title>ConvYH V2 Proxy Browser</title>
<style>
body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    margin: 0;
}
#topbar {
    background: #111;
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
}
#url {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: #222;
    color: white;
}
button {
    padding: 10px 20px;
    background: #3a3aff;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}
#tabs {
    display: flex;
    gap: 6px;
    padding: 10px;
    background: #0f0f0f;
}
.tab {
    padding: 6px 12px;
    background: #1c1c1c;
    border-radius: 4px;
    cursor: pointer;
    color: #ccc;
}
.tab.active {
    background: #333;
    color: #fff;
}
#view {
    padding: 20px;
    background: #050505;
    height: calc(100vh - 120px);
    overflow-y: auto;
}
#view.stealth {
    filter: blur(5px);
}
</style>
</head>
<body>

<div id="topbar">
    <input id="url" placeholder="Enter URL (https://example.com)">
    <button onclick="newTab()">Open</button>
    <button onclick="toggleStealth()">Stealth</button>
</div>

<div id="tabs"></div>
<div id="view">ConvYH V2 Ready.</div>

<script>
const API_URL = "https://api.apify.com/v2/acts/jkG4dEgaIazTU7dWu/run-sync?token=YOUR_API_KEY_HERE";

let tabs = [];
let activeTab = null;

function renderTabs() {
    const tabsDiv = document.getElementById("tabs");
    tabsDiv.innerHTML = "";
    tabs.forEach(t => {
        const el = document.createElement("div");
        el.className = "tab" + (t.id === activeTab ? " active" : "");
        el.innerText = t.title;
        el.onclick = () => switchTab(t.id);
        tabsDiv.appendChild(el);
    });
}

function switchTab(id) {
    activeTab = id;
    const tab = tabs.find(t => t.id === id);
    document.getElementById("view").innerHTML = tab.content;
    renderTabs();
}

async function newTab() {
    const url = document.getElementById("url").value.trim();
    if (!url) return;

    const id = Date.now();
    const tab = {
        id,
        title: url.slice(0, 20),
        content: "Loading..."
    };

    tabs.push(tab);
    activeTab = id;
    renderTabs();
    document.getElementById("view").innerHTML = "Loading...";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url })
        });

        const data = await res.json();
        tab.content = data.output.body || "No content returned.";

        if (activeTab === id) {
            document.getElementById("view").innerHTML = tab.content;
        }
        renderTabs();
    } catch (err) {
        tab.content = "Error: " + err;
        document.getElementById("view").innerHTML = tab.content;
        renderTabs();
    }
}

function toggleStealth() {
    document.getElementById("view").classList.toggle("stealth");
}
</script>

</body>
</html>
